name: CI and Deploy to GitHub Pages

# CI : exécutée sur chaque pull request vers main et sur chaque push de branche.
# Déploiement : uniquement après succès de la CI, et uniquement sur un push sur main.
# NB : GitHub Pages ne peut pas exécuter les fonctions /api/* (Stripe, analytics,
# abonnements). Si le site public est servi par Vercel, ce déploiement Pages n'est
# utile que comme prévisualisation statique — voir le rapport de phase 1.

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  ci:
    name: CI (typecheck, lint, tests, build)
    runs-on: ubuntu-latest
    # Une seule CI par référence : une nouvelle exécution annule la précédente.
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # Les dépendances actuelles du projet exigent Node 22+
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload artifact
        # Le build n'est publié que depuis main ; ailleurs il sert seulement de vérification.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    name: Deploy to GitHub Pages
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
